# mdBook build config template — copy to your book dir (e.g. <workspace>/mdbook/book.toml), fill in the title.
# Wire plugins from INSIDE the book dir: cd <book-dir> && mdbook-admonish install .
# (add `mdbook-mermaid install .` only once a mermaid block exists — it edits this file too)
# Toolchain: mdbook 0.5.x + mdbook-katex (crates.io, >=0.10) + mdbook-mermaid from crates.io;
# mdbook-admonish must be built from the tixena/mdbook-admonish git fork
# (crates.io 1.20.0 predates mdbook 0.5 and crashes on it) — see MDBOOK.md "Toolchain"
# (incl. the stale-Cargo.lock fix for git-installed preprocessors).
#
# katex_text_fix.py: copy assets/scripts/katex_text_fix.py from the teach skill
# into the book root (mdbook runs the command with cwd = the book dir). It must
# exit 0 on `supports <renderer>` probes (it does) and keep `after = ["katex"]`:
# mdbook 0.5 runs preprocessors alphabetically by config name (declaration order
# is ignored), which already puts katex first — the directive pins that against
# renames.
#
# If a course uses no admonish callouts and no mermaid, the minimal wiring is
# katex + katex-text-fix only (drop the admonish block and the additional-css
# reference to mdbook-admonish.css).

[book]
title = "TODO — course title"
authors = []
src = "src"
language = "en"

[build]
build-dir = "book"
create-missing = false

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`

[preprocessor.katex]
# must run after admonish: admonish turns callout fences into HTML first,
# otherwise mdbook-katex skips math inside them as code blocks.
# Add `no-css = true` if you vendor katex.min.css + fonts yourself
# (offline math — see MDBOOK.md gotchas) instead of the default CDN <link>.
after = ["admonish"]

# escapes _ and * in KaTeX html text nodes: katex emits raw span runs that
# pulldown parses as paragraph text, where rendered underscores pair into
# emphasis across span boundaries ("unclosed <span>" warnings)
[preprocessor.katex-text-fix]
command = "python3 katex_text_fix.py"
after = ["katex"]

# uncomment when the course gains its first mermaid diagram,
# then run: cd mdbook && mdbook-mermaid install .
# [preprocessor.mermaid]
# command = "mdbook-mermaid"

[output.html]
default-theme = "light"
additional-css = ["./mdbook-admonish.css"]
# additional-js = ["mermaid.min.js", "mermaid-init.js"]  # added by mdbook-mermaid install
